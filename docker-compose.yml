# Local PostgreSQL for development and integration tests.
name: aureo
# Port 5440 avoids clashing with other Postgres instances on the default 5432.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aureo
      POSTGRES_PASSWORD: aureo
      POSTGRES_DB: aureo
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aureo -d aureo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
